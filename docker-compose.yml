services:
  collab-server:
    build: ./server
    container_name: collab-server
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
    restart: unless-stopped

  collab-client:
    build: ./client
    container_name: collab-client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:4000
      - VITE_WS_URL=ws://localhost:4000
    depends_on:
      - collab-server
    restart: unless-stopped
